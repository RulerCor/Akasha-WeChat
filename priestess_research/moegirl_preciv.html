<p><b>前文明</b>，或称<b>先史文明</b>，是是上海鹰角网络科技有限公司制作的《<a href="/%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F" title="明日方舟">明日方舟</a>》及《<a href="/%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F%EF%BC%9A%E7%BB%88%E6%9C%AB%E5%9C%B0" title="明日方舟：终末地">明日方舟：终末地</a>》中登场的一个架空文明。
</p>
<meta property="mw:PageProp/toc" />
<div class="mw-heading mw-heading2"><h2 id="简介"><span id=".E7.AE.80.E4.BB.8B"></span>简介</h2></div>
<p>《明日方舟》剧情中反复提及到的一个极度发达的宇宙级别的远古文明，拥有亚空间航行的能力。约在泰拉纪元前11000年左右因被代称为“伐木工”的不明终极危机而覆灭。前文明在泰拉遗留的造物哺育了新生的泰拉文明，在塔卫二也留下了大量痕迹。
</p><p>目前对于前文明的描述缺乏系统性叙述，除游戏剧情外，在《大地巡旅》的凯尔希批注中以及PV4解密活动文件中亦有相关记载。
</p>
<div class="mw-heading mw-heading2"><h2 id="前文明造物"><span id=".E5.89.8D.E6.96.87.E6.98.8E.E9.80.A0.E7.89.A9"></span>前文明造物</h2></div>
<div class="mw-heading mw-heading3"><h3 id="静滞所与保存者"><span id=".E9.9D.99.E6.BB.9E.E6.89.80.E4.B8.8E.E4.BF.9D.E5.AD.98.E8.80.85"></span>静滞所与保存者</h3></div>
<p>前文明用于躲避终极灾厄的设施之一，具体实施方式为令大量的人类进入休眠，并由研究人员特雷弗·弗里斯顿的复制意识进行看管。但该计划启动后不久即因休眠系统失效、休眠人类死亡而宣告失败，残余的能量后来被保存者让给了重新发掘出静滞所的<a href="/%E5%85%8B%E4%B8%BD%E6%96%AF%E8%85%BE" class="mw-redirect" title="克丽斯腾">克丽斯腾</a>，用以支持其击穿天空阻隔层。特里蒙弧光事件之后，静滞所的能量被彻底耗尽，保存者的数据被<a href="/%E5%87%AF%E5%B0%94%E5%B8%8C" title="凯尔希">凯尔希</a>删除，但<a href="/%E9%9C%8D%E5%B0%94%E6%B5%B7%E9%9B%85" title="霍尔海雅">霍尔海雅</a>在最后关头留下了一份保存者的拷贝，该拷贝被可露希尔装载到了机器作业平台身上，即<a href="/Friston-3" title="Friston-3">Friston-3</a>。
</p><p>在2023年4月官方发布SideStory「孤星」活动机制前瞻时，曾在长图末尾用极其暗淡的文字写了一段话，但随后即被换源。
</p>

<td>Preservators and their related facilities are one of the means used by human beings to evade observers and preserve human blood.
<p>Through this large-scale freezer management facility, a large number of people have entered a dormant state, avoiding observation by observers, and waiting for the day when human civilization will be reborn, before that, the entire facility was managed by the preserver-a semi-mechanical and semi-human consciousness (due to the fear that the purely mechanical AI would be hijacked by observers, the preserver is not an artificial intelligence in the ordinary sense).
</p>
</td>
<td>保存者及其相关设施是人类躲避观察者、保存人体血脉的手段之一。
<p>通过这种大规模的冷冻管理设施，大量的人进入了休眠状态，躲避观察者的观察，等待着人类文明重生的那一天。在此之前，整个设施都是由保存者管理的——一种半机械半人类的意识（由于担心纯机械的人工智能会被观察者劫持，保存者不是普通意义上的人工智能）。
</p>
</td></tr></tbody></table>
<p>在2024年5月的PV4解密活动期间，官方向部分玩家发放了一份磁带，内容为预言家（博士）的录音（下简称“预言家录音”），第一段即关于保存者：

<td style="text-align: left; padding: 1em; vertical-align: middle;">The Custodians, TT 9th of March 209 16:29<br />
我还记得，最后一次和你辩论的时候，你说自己绝对不会再和蠢人共事，就算这个蠢人，是宇宙里最后一个还在尝试挽救文明的人。呵，现在看来，我也是一个蠢人。但我绝对不是最后一个试图再做点什么的人。想必这个时候，你一定已经和家人做了告别。但他们一定不会知道，你不会进入石棺，我们都清楚。保存者计划没有得到很多支持，原因不是这项计划没法拯救所有人，而是必须有人为此付出残忍的牺牲。你会独自度过漫长的时光。而我会等待阳光，从轨道反射镜中散去。熄灭我面前的这盏灯。弗里斯顿，泰拉上的最后一个蠢人，向你告别。</td>

<p>前文明的行星改造计划，位于今泰拉大陆以南海洋深处地幔层中，其原理为利用巨兽在体内孕育生态系统的特性打造生命的方舟。但在前文明覆灭后逐渐失控，产生的海嗣成为了阿戈尔和伊比利亚乃至整片大地的大敌。
</p><p>目前已知博士拥有该计划的多个设施的权限。
</p><p>预言家录音的第二段提及了深蓝之树计划的创造者——陆：
</p>
<table style="display: table; border-collapse: collapse; margin: auto; background-color:transparent;">
<tbody><tr>
<td style="vertical-align: top; color:#B2B7F2; font-size:36px; font-family:&#39;Times New Roman&#39;,serif; font-weight:bold; text-align:left; padding:10px 10px; line-height:100%">“</td>
<td style="text-align: left; padding: 1em; vertical-align: middle;">The Forsterer, TT 23rd of December 228 02:16<br />
陆，很抱歉没能继续回复你，但这是一个迟到的好消息。你在深蓝之树的那几位几公里长的大朋友，他们活体组织样本的环境适应性分析已经全部完成。从分析结果来看，他们能从毁灭中幸存下来。但他们也需要很多时间，才能成为播撒新希望的航船。陆，请不要认为你的成功对我们来说为时已晚，让他们活下去吧。这些美丽的海洋生灵没有必要加入我们的毁灭，未来也许他们会带上我们留下的一点点尘埃，向冰冷的虚空迈出一步。</td>
<td style="vertical-align: bottom; color:#B2B7F2; font-size:36px; font-family:&#39;Times New Roman&#39;,serif; font-weight:bold; text-align:left; padding:10px 10px; line-height:100%">”</td>
</tr>

<div class="mw-heading mw-heading3"><h3 id="天堂支点"><span id=".E5.A4.A9.E5.A0.82.E6.94.AF.E7.82.B9"></span>天堂支点</h3></div>
<p>前文明的武器，一个计量天体。关于它的具体情况不明，但玩家间普遍认为其与泰拉双月中的影月有密切关联。泰拉文明正是借助天堂支点的重启找到了与北方星门配对的塔卫二星门。
</p><p>预言家录音的第三段提及了天堂支点计划的创造者——艾德：
</p>
<table style="display: table; border-collapse: collapse; margin: auto; background-color:transparent;">
<tbody><tr>
<td style="vertical-align: top; color:#B2B7F2; font-size:36px; font-family:&#39;Times New Roman&#39;,serif; font-weight:bold; text-align:left; padding:10px 10px; line-height:100%">“</td>
<td style="text-align: left; padding: 1em; vertical-align: middle;">The Security, TT 16th of January 229 09:56<br />
艾德，这是我最后一次向你说明我的看法。很快，所有的人造天体都会成为轨道上的墓碑，再也没人可以对他们发号施令，你也一样。我还记得你的小副业，那家开在拖船里的老餐馆，没有合成设备，只有围裙和烤炉，而你是最后一个知道怎么宰杀动物、怎么把他们加工成食物的人。你总是反对我们遗忘，所以艾德，我希望你能够理解，我们需要的不是胜利，是存续。天堂支点的确是一件强大的武器，但我们的敌人无法被武器打倒，设置（此处有杂音干扰）没有意义。</td>
<td style="vertical-align: bottom; color:#B2B7F2; font-size:36px; font-family:&#39;Times New Roman&#39;,serif; font-weight:bold; text-align:left; padding:10px 10px; line-height:100%">”</td>
</tr>

<div class="mw-heading mw-heading3"><h3 id="源石"><span id=".E6.BA.90.E7.9F.B3"></span><a href="/%E6%BA%90%E7%9F%B3" title="源石">源石</a></h3></div>
<p>前文明的能源项目，后被<a href="/%E6%99%AE%E7%91%9E%E8%B5%9B%E6%96%AF" title="普瑞赛斯">普瑞赛斯</a>改造，使其能自我复制并同化外界事物，将信息保存于源石的内在宇宙。源石将来自<a href="/%E5%A1%94%E5%8D%AB%E4%BA%8C" title="塔卫二">塔卫二</a>的生物改造成了人类的模样，滋养了后来的泰拉文明，也为泰拉人带来了名为“矿石病”的灾厄。源石有三个主源石端口，对应泰拉的三条源石主矿脉，被泰拉文明称作“最初的源石”。
</p><p>在泰拉文明开始开拓<a href="/%E5%A1%94%E5%8D%AB%E4%BA%8C" title="塔卫二">塔卫二</a>后，源石与当地的特殊时空“超域”互相影响，从而诞生了可以对物质进行瞬时传送的“协议源石”，这一技术成为了<a href="/%E7%BB%88%E6%9C%AB%E5%9C%B0%E5%B7%A5%E4%B8%9A" title="终末地工业">终末地工业</a>的核心。
</p><p>在《<a href="/%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F%EF%BC%9A%E7%BB%88%E6%9C%AB%E5%9C%B0" title="明日方舟：终末地">明日方舟：终末地</a>》中登场的“<a href="/%E7%AE%A1%E7%90%86%E5%91%98" title="管理员">管理员</a>”拥有随意操纵源石的能力。目前尚不知晓这一能力的来历，但根据剧情PV及现有剧情，这一能力很可能与预言家/博士和普瑞赛斯有密切关联。
</p><p>第一次天使战争后，被带到塔卫二的“最初的源石”遭受了污染，其概念性的损伤让它的性质发生了退化。在<a href="/%E5%8D%8E%E6%B3%95%E7%90%B3" title="华法琳">华法琳</a>的领导下，罗德岛开始对其进行抢救性研究，却意外导致内化宇宙中的信息碎片析出至现实空间——这便是“<a href="/%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F%EF%BC%9A%E7%BB%88%E6%9C%AB%E5%9C%B0#再旅者" title="明日方舟：终末地">再旅者</a>”的诞生。
</p><p>预言家录音的第四段的寓言可能就是在指代源石和最终危机：
</p>
<table style="display: table; border-collapse: collapse; margin: auto; background-color:transparent;">
<tbody><tr>
<td style="vertical-align: top; color:#B2B7F2; font-size:36px; font-family:&#39;Times New Roman&#39;,serif; font-weight:bold; text-align:left; padding:10px 10px; line-height:100%">“</td>
<td style="text-align: left; padding: 1em; vertical-align: middle;">The Lumberer, TT<br />
请想象一片不完美的树林，昆虫与飞鸟并不常见，也没有狩猎的野兽在其中漫步。有时，两颗原本相差无几的树苗，一颗夭折于幼年，另一颗却长出了繁盛的树冠；有时某些树木会投下恶意的影子，让他们的邻居在阴影中枯萎。这些都算不上多么可怕的事，毕竟他们只是树木而已。但是在这片树林里住着一位伐木工，伐木工勤劳地挥动着斧子，树木在他面前一一倒下，无论他们的枝杈是否蓬勃、果实是否甜美、叶片在阳光下是什么颜色。没有哪棵树了解这位伐木工的来历，那些古老的树木早已沉寂，也没有哪棵树能阻止伐木工挥动斧子，再盘根错节的枝干也会被劈开。你相信吗？竟然有这样一片树林，这样一位伐木工。好，我们继续。这一天，伐木工照常举起了斧子，又一棵树在他面前倒下，可伐木工转身离去后，树桩里溢出了树脂，把断裂的枝干粘合在一起。伐木工清理出的空地再一次长满了树木，而且还不止于此，透明的树脂吞没了这片只存在于故事里的树林，你眼前很快就只剩下一枚漂亮的琥珀，没有随风而动的树木和伐木工的斧子，也没有分形、函数、与哲学的纤维在湿润的土壤中生长。现在，我需要你记住这枚琥珀的样子，它真的很美。</td>
<td style="vertical-align: bottom; color:#B2B7F2; font-size:36px; font-family:&#39;Times New Roman&#39;,serif; font-weight:bold; text-align:left; padding:10px 10px; line-height:100%">”</td>
</tr>
</tbody></table>
<p>但在第四段的背景音中，出现了机械女声的四个一组的报数，据分析其为汉字区位码，转写后可得“警惕你自己源石目标已粳<sup id="cite_ref-1" class="reference"><a href="#cite_note-1"><span class="cite-bracket">&#91;</span>1<span class="cite-bracket">&#93;</span></a></sup>改变相信AMa-10”。
</p>
<div class="mw-heading mw-heading3"><h3 id="灰质销钉（Lynchpin_of_Substantia_grisea）"><span id=".E7.81.B0.E8.B4.A8.E9.94.80.E9.92.89.EF.BC.88Lynchpin_of_Substantia_grisea.EF.BC.89"></span>灰质销钉（Lynchpin of Substantia grisea）</h3></div>
<p>前文明的一种疗法，应用于亚空间领航员，用于其在航行中保持正确认知。
</p><p>该设定首次揭示于PV4的解密活动，官方向玩家发放预言家录音时附赠了一张卡片，不同玩家收到的卡片不同，将上面的文字拼接起来可以获得一篇短文：
</p>
<table class="wikitable">

<tbody><tr>
<td><span typeof="mw:File"><a href="/File:%E6%A5%94%E4%BA%8E%E7%81%B0%E8%B4%A8%E4%B9%8B%E9%92%89.jpg" class="mw-file-description"><img src="https://storage.moegirl.org.cn/moegirl/commons/b/b2/%E6%A5%94%E4%BA%8E%E7%81%B0%E8%B4%A8%E4%B9%8B%E9%92%89.jpg!/fw/200?v=20240521080624" decoding="async" width="200" height="127" class="mw-file-element" srcset="https://storage.moegirl.org.cn/moegirl/commons/b/b2/%E6%A5%94%E4%BA%8E%E7%81%B0%E8%B4%A8%E4%B9%8B%E9%92%89.jpg!/fw/300/watermark/url/L21vZWdpcmwvd2F0ZXJtYXJrLnBuZw==/align/southeast/margin/10x10/opacity/50?v=20240521080624 1.5x, https://storage.moegirl.org.cn/moegirl/commons/b/b2/%E6%A5%94%E4%BA%8E%E7%81%B0%E8%B4%A8%E4%B9%8B%E9%92%89.jpg!/fw/400/watermark/url/L21vZWdpcmwvd2F0ZXJtYXJrLnBuZw==/align/southeast/margin/10x10/opacity/50?v=20240521080624 2x" data-file-width="1024" data-file-height="649" /></a></span>
</td>
<td><big><b>Lynchpin</b></big>
<p><b>Lynchpin of Substantia grisea</b>
</p>
<hr />
<p>Never forget where you are going. Subspace may have been conquered, an off-course mind may be your only enemy in a voyage, yet it is still a great one.
</p><p>The term "lynchpin" commonly refers to a widely adopted therapy that utilizes a noninvasive mind-implanting technique to sharpen an individual's spatial perception and memory capacity. Most recipients, or "lynchpined", are subspace navigators onboard any SST-capable<sup id="cite_ref-2" class="reference"><a href="#cite_note-2"><span class="cite-bracket">&#91;</span>2<span class="cite-bracket">&#93;</span></a></sup> vessels as such enhancement are vital to them in carrying out their duties.
</p><p>In summary, "Lynchpin" takes effect by imprinting an individual's mind pattern in a critical debate process and periodicallly restimulating the same pattern in that individual's metaconsciousness layer. For navigators, this will almost always ensure a spontaneous, clear, and logical recongnition of a specific travel destination, otherwise proved difficult under prolonged subspace exposure.
</p>
</td>
<td><big><b>Lynchpin</b></big>
<p><b>灰质销钉</b>
</p>
<hr />
<p>永远不要忘记你要去哪里，亚空间或许已被征服，但在这场伟大的航行中，迷失的心灵仍会成为你的唯一敌人。
</p><p>Lynchpin一般指一个被广泛采用的，依靠非侵入性思维植入技术，用于增强个人空间感知能力和记忆力的疗法。绝大多数受试者（或者说被钉之人）都会成为亚空间领航员且驾驶任何支持亚空间旅行的飞船，因为此种增强对他们履行职责的能力至关重要。
</p><p>总而言之，Lynchpin在个体经历关键辩论过程中，通过将其思维模式刻印下来而发挥作用，并且会周期性在该个体的元意识层中重复刺激产生相同的思维模式。对于领航员而言，这可以几乎确保其能够产生一个对航行目的地的，自发清晰而逻辑性的认知，这一过程在长期暴露在亚空间的环境下已证实难以自发实现。
</p>
</td></tr></tbody></table>
<p>在PV4解密活动第一环节的网站上，展示了一张磁带的照片，上面被涂污的文字里出现了“Be aware of lynchpin”（小心钉子），结合此后发布的录音中的暗号，以及SideStory「巴别塔」剧情中预言家提及的“陷入了一场阳谋”，推测预言家可能也接受了灰质销钉，且敏锐注意到销钉被做了手脚。在第十五章剧情中上述猜测得到了证实。
</p><p>此外，考虑到邪魔也存在于亚空间并依赖认知而强大，推测灰质销钉正是针对这一情况而准备的。
</p>
<div class="mw-heading mw-heading3"><h3 id="PCS（人格与认知同步系统）"><span id="PCS.EF.BC.88.E4.BA.BA.E6.A0.BC.E4.B8.8E.E8.AE.A4.E7.9F.A5.E5.90.8C.E6.AD.A5.E7.B3.BB.E7.BB.9F.EF.BC.89"></span>PCS（人格与认知同步系统）</h3></div>
<p>前文明搭建的用于同步认知的系统，原本配合源石计划使用，但后来被掩埋。在泰拉历史上，一支提卡兹在奉命寻找生存的方法时遇到了PCS，在其中一人表现出“活着”的愿望后，PCS赋予这些提卡兹光环、翅膀以及共感能力。律法、萨科塔族与拉特兰城自此诞生，而那位许愿者成为了拉特兰历史上第一位圣徒<a href="/%E6%AD%A7%E6%B3%95" title="歧法">歧法</a>。后来在普瑞赛斯的干涉下，PCS开始大规模赐予非萨科塔族乃至非生命共感，但最终因为自身无法解决存续与愿望的悖论而请求<a href="/%E5%AE%89%E5%A4%9A%E6%81%A9" title="安多恩">安多恩</a>和<a href="/%E9%80%81%E8%91%AC%E4%BA%BA" title="送葬人">费德里科</a>炸毁自己。PCS被摧毁后原址开放供人参观，而共感系统则依然生效。
</p><p>PCS在设计时模仿了一种名为“天使”的生物，这也就是为什么提卡兹会被赋予光环与翅膀。而在《<a href="/%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F%EF%BC%9A%E7%BB%88%E6%9C%AB%E5%9C%B0" title="明日方舟：终末地">明日方舟：终末地</a>》中，“天使”作为一种害兽而存在。
</p>
<div class="mw-heading mw-heading3"><h3 id="DWDB-221E/“文明的存续”"><span id="DWDB-221E.2F.E2.80.9C.E6.96.87.E6.98.8E.E7.9A.84.E5.AD.98.E7.BB.AD.E2.80.9D"></span>DWDB-221E/“文明的存续”</h3></div>
<p>前文明搭建的公共计量再现平台，外观呈王冠状，黑色，佩戴者可以借此阅读他人的思想并存储之。在前文明覆灭后，泰拉本土的生命捡起了该王冠并建立了提卡兹文明，佩戴该王冠的提卡兹（后来的萨卡兹）被称为“魔王”，是众萨卡兹的君主。目前“文明的存续”的持有者即本作主角之一的<a href="/%E9%98%BF%E7%B1%B3%E5%A8%85" title="阿米娅">阿米娅</a>，于1094年前代魔王特蕾西娅遇刺身亡前赐予。
</p><p>干员<a href="/%E7%89%B9%E8%95%BE%E8%A5%BF%E5%A8%85(%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F)" title="特蕾西娅(明日方舟)">魔王</a>的英文代号即是“文明的存续”，因为其本质上是特蕾西娅在“文明的存续”中留下来的一段程序。
</p><p>阿米娅的模组文档中对其诞生过程有较为详细的描写。
</p><p>续作《<a href="/%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F%EF%BC%9A%E7%BB%88%E6%9C%AB%E5%9C%B0" title="明日方舟：终末地">明日方舟：终末地</a>》中有名为“存续的痕迹”的珍稀培养素材，其外形与“文明的存续”相似但表面覆盖火焰样痕迹，尚不知晓世界观中该物品的来历。
</p>
<div class="mw-heading mw-heading3"><h3 id="AMa-10/凯尔希/Mon3tr"><span id="AMa-10.2F.E5.87.AF.E5.B0.94.E5.B8.8C.2FMon3tr"></span>AMa-10/<a href="/%E5%87%AF%E5%B0%94%E5%B8%8C" title="凯尔希">凯尔希</a>/<a href="/Mon3tr" title="Mon3tr">Mon3tr</a></h3></div>
<p>预言家和普瑞赛斯的造物，诞生于约纪元前12200年，拥有强大的仿生能力，但为了对抗“伐木工”的观测，Ama-10注定无法成为真正的生命。Ama-10由一对共生体组成（在主线剧情时间线上，表现为人形的凯尔希和兽形的Mon3tr）。后来预言家自觉自己陷入了某些困境，给予凯尔希自由并对她诉出寄托：
</p>
<table style="display: table; border-collapse: collapse; margin: auto; background-color:transparent;">
<tbody><tr>
<td style="vertical-align: top; color:#B2B7F2; font-size:36px; font-family:&#39;Times New Roman&#39;,serif; font-weight:bold; text-align:left; padding:10px 10px; line-height:100%">“</td>
<td style="text-align: left; padding: 1em; vertical-align: middle;"><div class="poem">
<p>我相信它们。相信你，凯尔希。<br />
凯尔希……我时间不多了。<br />
去寻找生命的痕迹，去寻找希望与未来。<br />
凯尔希……自己去得出答案吧。<br />
去找到你自己。
</p>
</div></td>
<td style="vertical-align: bottom; color:#B2B7F2; font-size:36px; font-family:&#39;Times New Roman&#39;,serif; font-weight:bold; text-align:left; padding:10px 10px; line-height:100%">”</td>
</tr><tr><td colspan="3" style="font-size: smaller; text-align: right; padding-right: 4%;"><cite style="font-style:normal;">——预言家，BB-8 终局倒计时 行动后剧情</cite>
</td></tr>
</tbody></table>
<p>此后一万三千年里，凯尔希参与了泰拉文明进程中的多起大事件并历经三次死亡而重生。在<a href="/%E6%99%AE%E7%91%9E%E8%B5%9B%E6%96%AF" title="普瑞赛斯">普瑞赛斯</a>苏醒之际，凯尔希切断了她和Mon3tr的联系并被普瑞赛斯带回源石内部，后由罗德岛借助“石棺”和“奥卡”以及普瑞赛斯留在石棺中的Ama-10源代码而得以作为泰拉人复生。
</p>
<div class="mw-heading mw-heading3"><h3 id="星门"><span id=".E6.98.9F.E9.97.A8"></span>星门</h3></div>
<p>位于泰拉大陆的巨构，已知在大陆南北两端各有一座星门，塔卫二已知的唯一一座星门位于星球北极。可能是前文明用于亚空间航行的设施。
</p><p>在前文明覆灭后其被邪魔所占据，两座星门在人类发现时已经被毁坏，但人类设法复原了其中损毁程度较轻的极北星门，冰原科考团曾遭遇盘踞其中的邪魔克雷松，在其引发剧烈坍缩前祖灵安玛现身与其同归于尽。随后科考团正式启动星门并进入后意外闯入了焚风热土，见证了路加萨尔古斯和哈兰杜汗的永恒战争。后来经过数代人的不懈努力与牺牲，在泰拉本恒星系的“天堂支点”重新启动后（即《明日方舟：终末地》主线时间一百五十二年前），泰拉人成功掌握了通过星门抵达<a href="/%E5%A1%94%E5%8D%AB%E4%BA%8C" title="塔卫二">塔卫二</a>的方法，并成功开拓塔卫二。少部分知晓“大部分泰拉人其实来自塔卫二”真相的人会将他们的这一做法称之为“回归”。
</p><p>此后塔卫二和泰拉之间的星门通道持续了五年时间，一直到塔罗斯历5年第一次天使战争爆发为止。天使的巨型集群摧毁了人类在塔卫二星门周围建立的最初的城市，引发了“塔卫二的极光”。自此之后，塔卫二和泰拉的联系断绝，滞留下来的人类只能从资料里回忆自己的家园。
</p>
<div class="mw-heading mw-heading3"><h3 id="阻隔层/星荚"><span id=".E9.98.BB.E9.9A.94.E5.B1.82.2F.E6.98.9F.E8.8D.9A"></span>阻隔层/星荚</h3></div>
<p>前文明为保护泰拉而设置的阻隔设施，体现为距地面约六千米的高能层带，常规飞行手段无法穿过这片区域。阻隔层导致了从泰拉地面观察的恒星运动完全没有规律，也阻碍了泰拉人对天空的探索。
</p><p>关于阻隔层，泰拉人曾提出过多种猜想，在炎国曾有“夕娥奔月”的传说。而地上人对阻隔层的正确认知则始于1099年11月21日，当晚莱茵生命总辖克丽斯腾·莱特利用静滞所的剩余能量击穿阻隔层，制造了短暂的空洞，并乘坐万星园穿过空洞，成为了泰拉现文明第一个突破阻隔层抵达太空的人。在此之后，为进一步研究阻隔层以及天空，科学家们将目光投向了泰拉最高峰、离阻隔层最近的喀兰雪山。
</p><p>在塔卫二北极区域的“极光”底部部分，其结构与能量特征与星荚有相似之处。
</p><p>海洋中的阿戈尔人则很早就建立了对阻隔层的认知，曾一度做好了击穿阻隔层并开展地外探索的准备，但因海嗣危机爆发而中断。
</p>
<div class="mw-heading mw-heading3"><h3 id="其他相关事物"><span id=".E5.85.B6.E4.BB.96.E7.9B.B8.E5.85.B3.E4.BA.8B.E7.89.A9"></span>其他相关事物</h3></div>
<ul><li>巨兽与前文明处于同一个时期，除前述深蓝之树利用了巨兽以外，目前已知“<a href="/%E5%B2%81" title="岁">岁</a>”的诞生之时恰逢前文明遭受灾厄，并见证了前文明人类到达泰拉。</li>
<li>泰拉文明现行历法——泰拉历，是萨尔贡君主路加萨尔古斯接触到疑似前文明造物后依照其显示的时间重新校正的。</li>
<li>维多利亚的国剑“诸王之息”原本是一件城防设施，据凯尔希所言：“在它被投入使用的年代，源石还未普遍存在于这片大地之上。”可能其也是前文明的造物。</li>
<li>罗德岛陆行舰也是前文明的造物，博士曾休眠于其中，后掩埋在今雷姆必拓境内，由凯尔希主持发掘出土。</li>
<li>为切尔诺伯格供能的石棺是前文明的家用生理修复仪，博士曾在此接受治疗，保存者计划中也有石棺被部署。但该装置只对前文明人类有效，当今的泰拉人进入其中会发生<a href="/%E6%A2%85%E8%8F%B2%E6%96%AF%E7%89%B9(%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F)#第七章_「苦难摇篮」_&amp;_第八章_「怒号光明」" title="梅菲斯特(明日方舟)">明显的返祖现象</a>。</li>
<li>“思维框架与智能思想库”的终端<a href="/index.php?title=%E9%A9%AC%E5%85%8B%C2%B7%E9%BA%A6%E5%85%8B%E6%96%AF&amp;action=edit&amp;redlink=1" class="new" title="马克·麦克斯（页面不存在）">马克·麦克斯</a>于哥伦比亚独立战争期间被发掘出土，为独立战争作出了重大贡献。其在战后担任总统至今。</li>
<li>集成战略#6「岁的界园志异」第四结局后日谈提到泰拉的精灵种族是前文明人类将自己的细胞与某些巨兽的细胞融合的造物。</li>
<li>集成战略#6「岁的界园志异」第四结局后日谈提到泰拉双月中的影月也是前文明人类的造物，内容拓展·Ⅱ后第三结局新增后日谈提到影月上有前文明留下的超级计算机群，很可能就是指天堂支点。</li></ul>
<div class="mw-heading mw-heading2"><h2 id="前文明人物"><span id=".E5.89.8D.E6.96.87.E6.98.8E.E4.BA.BA.E7.89.A9"></span>前文明人物</h2></div>
<dl><dt>预言家/<a href="/%E5%8D%9A%E5%A3%AB(%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F)" title="博士(明日方舟)">博士</a></dt>
<dd>参与了前文明的多项终极工程，并于纪元前11930年于罗德岛陷入休眠，至1090年被凯尔希所唤醒，现罗德岛制药公司指挥官。</dd>
<dt><a href="/%E6%99%AE%E7%91%9E%E8%B5%9B%E6%96%AF" title="普瑞赛斯">普瑞赛斯</a></dt>
<dd>自称“语言学家”，是源石的创造者之一，曾经与博士亲密无间。在博士失忆后仍能多次出现在博士的意识当中。曾经为凯尔希设下多道限制，让其不能说出关于源石以及她本人的更多信息。</dd>
<dd>罗德岛上的“原生罗德岛终端服务（PRTS）”与其关系不浅。</dd>
<dt><a href="/index.php?title=%E7%89%B9%E9%9B%B7%E5%BC%97%C2%B7%E5%BC%97%E9%87%8C%E6%96%AF%E9%A1%BF&amp;action=edit&amp;redlink=1" class="new" title="特雷弗·弗里斯顿（页面不存在）">特雷弗·弗里斯顿</a></dt>
<dd>研究人员，承担了保存者计划的看守任务。其意识拷贝目前保存于作业平台<a href="/Friston-3" title="Friston-3">Friston-3</a>中。</dd>
<dt>陆</dt>
<dd>深蓝之树的负责人之一，女性。在前文明毁灭前夕将希望托付给了伊莎玛拉等参与深蓝之树计划的巨兽后服毒自尽，其尸体被众巨兽吞噬，知识一并被吸收。</dd>
<dd>尚是“共生构造体”时的凯尔希似乎很喜欢她。</dd>
<dt>伊莎玛拉</dt>
<dd>曾接触过深蓝之树项目的人员，为深蓝之树项目中其中一只巨兽赐予和自己相同的名，并很可能改变了其行为模式，致使其诞生的海嗣开始吞噬一切以维持存续。</dd>
<dt>艾德</dt>
<dd>天堂支点的负责人。其他信息不详。</dd>
<dt>瓦莱莉娅及其丈夫</dt>
<dd>平民，丈夫的语音文件被阿戈尔人发掘出来，并由先史研究学者阿维图斯整理成通俗读物《生活的死亡》。</dd>
<dt><a href="/index.php?title=%E5%9F%BA%E7%9F%B3&amp;action=edit&amp;redlink=1" class="new" title="基石（页面不存在）">基石</a></dt>
<dd>被塔卫二的泰拉文明称作“大敌”和“被放逐者”的存在，前文明的守望者和孑遗，其正体不明，推测有数人。</dd>
<dd>锚点和天使皆为其造物，意图奴役泰拉文明以达成其目的，最终于约百年前的第一次天使战争中被<a href="/%E7%AE%A1%E7%90%86%E5%91%98" title="管理员">管理员</a>以特殊手段放逐至超域，却因源石的存在而得以苟延残喘。</dd>

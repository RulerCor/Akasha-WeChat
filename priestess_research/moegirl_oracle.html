<p><b>预言家</b>（英语：<span lang="en"><b>prophet</b></span>；日语：<span lang="ja"><b><ruby><rb data-id="template-ruby">預言者<span class="template-ruby-hidden">（</span></rb><rt style="font-size:0.75em">よげんしゃ</rt><span class="template-ruby-hidden">）</span></ruby></b></span>）是一种身份，是<a href="/ACG" title="ACG">ACG</a><a href="/%E6%AC%A1%E6%96%87%E5%8C%96" class="mw-redirect" title="次文化">次文化</a>中的<b><a href="/%E8%90%8C%E5%B1%9E%E6%80%A7" title="萌属性">萌属性</a></b>。
</p>
<div class="mw-heading mw-heading2"><h2 id="简介"><span id=".E7.AE.80.E4.BB.8B"></span>简介</h2></div>
<p><b>预言家</b>指能够作出预言的人。
</p><p>预言家可以是具有<a href="/%E9%A2%84%E7%9F%A5%E6%9C%AA%E6%9D%A5" title="预知未来">预知未来</a>能力的主动预言者，也可以是有<a href="/%E4%B9%8C%E9%B8%A6%E5%98%B4" title="乌鸦嘴">乌鸦嘴</a>/<a href="/%E6%AF%92%E5%A5%B6" title="毒奶">毒奶</a>属性的被动预言者。预言家与单纯的<a href="/%E9%A2%84%E7%9F%A5%E6%9C%AA%E6%9D%A5" title="预知未来">预知未来</a>能力者和<a href="/%E4%B9%8C%E9%B8%A6%E5%98%B4" title="乌鸦嘴">乌鸦嘴</a>人士不同的是，这些人中一部分的预知只为自己所用，预言家更注重传递给他人关于未来的预测。
</p><p>有一部分预言家同时也是<a href="/%E5%8D%A0%E5%8D%9C%E5%B8%88" title="占卜师">占卜师</a>，借助占卜道具来预测未来，一部分预言家有可视性的<a href="/%E9%A2%84%E7%9F%A5%E8%83%BD%E5%8A%9B" class="mw-redirect" title="预知能力">预知能力</a>，可以直接观测到未来。
</p><p>在现实中，一些人在无意间说的一句话或通过全面的分析总结出的观点如果在未来被应验，某些人就会跑回去将其称为“大预言家”。
</p>
<div class="mw-heading mw-heading2"><h2 id="狼人杀中的角色"><span id=".E7.8B.BC.E4.BA.BA.E6.9D.80.E4.B8.AD.E7.9A.84.E8.A7.92.E8.89.B2"></span>狼人杀中的角色</h2></div>
<p>预言家是桌游<a href="/%E7%8B%BC%E4%BA%BA%E6%9D%80" title="狼人杀">狼人杀</a>中的一个角色，属于好人和神职阵营，能力是每天晚上可以查验一个角色是好人还是狼人。因为其的查验身份功能，预言家在多数情况下是好人阵营打开视野的主要身份，也最常成为坏人/狼人阵营的优先击杀（夜晚刀掉）对象。“刀预言家”这一说法也已走出狼人杀游戏圈广泛流传，前文提及的在现实及网络中一些人的话或观点在未来被应验被应验时也会有人开玩笑地留言“刀了吧”。
</p>

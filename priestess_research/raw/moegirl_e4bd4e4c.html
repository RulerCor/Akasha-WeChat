<p><b>博士</b>是上海鹰角网络科技有限公司制作的游戏<b>《<a href="/%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F" title="明日方舟">明日方舟</a>》</b>及其衍生作品的登场角色，是游戏中玩家所扮演的角色。
</p>

<div class="mw-heading mw-heading2"><h2 id="简介"><span id=".E7.AE.80.E4.BB.8B"></span>简介</h2></div>
<p>罗德岛的高层领导，三大创始人之一。作为矿石病治疗与天灾研究方面的顶尖学者，拥有生物学，神经工程学博士等学历。致力于清除矿石病，是罗德岛的中流砥柱之一。虽然本身没有战斗能力，但是拥有极强的指挥能力。目前由于<span title="你知道的太多了" class="heimu">被特蕾西娅删掉了记忆，不过在除了凯尔希以外的人看来是</span>未知原因而失忆。
</p>

e="工具人博士"><img alt="苹果应用商店专题中鹰角对于博士的设计的解释" src="https://storage.moegirl.org.cn/moegirl/commons/a/a0/Doctor_setting.jpg!/fw/180?v=20190820030041" decoding="async" width="180" height="175" class="mw-file-element" srcset="https://storage.moegirl.org.cn/moegirl/commons/a/a0/Doctor_setting.jpg!/fw/270?v=20190820030041 1.5x, https://storage.moegirl.org.cn/moegirl/commons/a/a0/Doctor_setting.jpg!/fw/360/watermark/url/L21vZWdpcmwvd2F0ZXJtYXJrLnBuZw==/align/southeast/margin/10x10/opacity/50?v=20190820030041 2x" data-file-width="750" data-file-height="729" /></a><figcaption><del>工具人博士</del></figcaption></figure></td></tr><tr class="gallery-mod-text"><td class="core"><div class="caption" style="min-height:3.1em;width:187px"><del>工具人博士<sup id="cite_ref-6" class="reference"><a href="#cite_note-6"><span class="cite-bracket">&#91;</span>6<span class="cite-bracket">&#93;</span></a></sup></del>&#160;</div></td></tr></tbody></table></td></tr></tbody></table>
<div style="clear: both; height: 1em"></div>
<ul><li>距今三年前（即泰拉历1094年），凯尔希将博士送入石棺<span title="你知道的太多了" class="heimu">接受“家用生理修复仪”治疗</span>。</li>
<li>由于前四章的剧情文案中有大量的省略号，因此在一些同人作品中，博士只会说<ruby><rb data-id="template-ruby">“……”<span class="template-ruby-hidden">（</span></rb><rt style="font-size:0.75em"><span title="" class="heimu">打点计时器</span></rt><span class="template-ruby-hidden">）</span></ruby><span title="你知道的太多了" class="heimu">某种说法是博士失忆时顺便忘了怎么说话</span>。不过从第五章和第六章开始，剧情文案有所改变，博士就有了很多可说的话。
<ul><li>到了第十三章，博士在剧情中主动开口说话的频率大幅提升，不再如往常那般沉默或是只能通过选项表达台词<s class="just-kidding-text" title="只为博君一笑，不必照单全收XD">医学奇迹</s>。</li></ul></li>
<li>和大多数手游的主角一样性别不明 <sup id="cite_ref-7" class="reference"><a href="#cite_note-7"><span class="cite-bracket">&#91;</span>7<span class="cite-bracket">&#93;</span></a></sup>。</li>
<li>实际上每次作战，博士都是在前线指挥，而且在作战间隙也在工作<sup id="cite_ref-8" class="reference"><a href="#cite_note-8"><span class="cite-bracket">&#91;</span>8<span class="cite-bracket">&#93;</span></a></sup>。</li>
<li>从各个干员的对话中得知，博士的身体非常虚弱，可能是在石棺里睡久了造成的肌肉萎缩。但根据第八章剧情凯尔希将石棺称为“家用生理修复仪”，应该不是石棺后遗症，只是单纯身体弱，<sup id="cite_ref-9" class="reference"><a href="#cite_note-9"><span class="cite-bracket">&#91;</span>9<span class="cite-bracket">&#93;</span></a></sup> <span title="你知道的太多了" class="heimu">实际上可能是因为泰拉种族人均超人体质才显得博士这个纯种人类弱</span>。但有非常渊博的学识<sup id="cite_ref-10" class="reference"><a href="#cite_note-10"><span class="cite-bracket">&#91;</span>10<span class="cite-bracket">&#93;</span></a></sup>和优秀的战术指挥能力。</li>
<li>根据一名nga网友对游戏二测一开始抢救剧情的考据，博士可能是得了主动脉夹层或因外伤损伤了主动脉。在你睁眼前进行的整个手术可能是主动脉弓切除+人工血管置换+分支血管成型+降主动脉内支架置入术<sup id="cite_ref-11" class="reference"><a href="#cite_note-11"><span class="cite-bracket">&#91;</span>11<span class="cite-bracket">&#93;</span></a></sup>。</li>
<li>似乎有掉头发的毛病<sup id="cite_ref-12" class="reference"><a href="#cite_note-12"><span class="cite-bracket">&#91;</span>12<span class="cite-bracket">&#93;</span></a></sup>。</li>
<li>晕针</li>
<li>有时候敏锐得要命，有时候又像块木头一样<sup id="cite_ref-:0_13-0" class="reference"><a href="#cite_note-:0-13"><span class="cite-bracket">&#91;</span>13<span class="cite-bracket">&#93;</span></a></sup></li>
<li>会偷偷藏糖<sup id="cite_ref-:1_14-0" class="reference"><a href="#cite_note-:1-14"><span class="cite-bracket">&#91;</span>14<span class="cite-bracket">&#93;</span></a></sup></li>
<li>偶尔不自觉想起往事<sup id="cite_ref-15" class="reference"><a href="#cite_note-15"><span class="cite-bracket">&#91;</span>15<span class="cite-bracket">&#93;</span></a></sup></li>
<li>办公室比较大（挽歌燃烧殆尽ss首次出现关于办公室的背景图），藏书很多，办公室几乎随便进<sup id="cite_ref-16" class="reference"><a href="#cite_note-16"><span class="cite-bracket">&#91;</span>16<span class="cite-bracket">&#93;</span></a></sup></li>
<li>许多玩家称博士为刀客特/刀客塔，实际上是日式英文<ruby><rb data-id="template-ruby">doctor<span class="template-ruby-hidden">（</span></rb><rt style="font-size:0.75em">博士</rt><span class="template-ruby-hidden">）</span></ruby>的音译。</li>
<li><a href="/%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F/%E6%A2%97#口腔泡面" title="明日方舟/梗">在失忆前相当擅长在凌晨四点时，用沸腾的饮用水直接在口腔中加热速食食品。</a>而用于泡面的<a href="/%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F/%E9%9B%86%E6%88%90%E6%88%98%E7%95%A5/%E6%94%B6%E8%97%8F%E5%93%81#收藏品整合" class="mw-redirect" title="明日方舟/集成战略/收藏品">热水壶</a><sup id="cite_ref-:0_13-1" class="reference"><a href="#cite_note-:0-13"><span class="cite-bracket">&#91;</span>13<span class="cite-bracket">&#93;</span></a></sup>在集成战略玩法的收藏品中出现。<span title="你知道的太多了" class="heimu"><a href="/%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F/%E6%A2%97#水烧开了" title="明日方舟/梗">博士！热水壶准备好了！</a></span><span title="你知道的太多了" class="heimu">巴别塔的饿灵</span></li>
<li>两周年前更新了博士头像系统，其中一个头像“请勿模仿”即是红色禁止符号配上黑色小人用热水壶直接向口中倒水，配上下一个内容为热水壶和杯面的头像“晚餐”，坐实了博士口冲泡面的传闻<span title="你知道的太多了" class="heimu">以及让大家不要模仿</span>。</li>
<li>从乌萨斯的孩子们剧情中可得知，博士会纸牌和硬币魔术。</li>
<li>第八章阿米娅解放一个戒指与不死的黑蛇战斗至力尽倒下后<span title="你知道的太多了" class="heimu">疑似是因为源石融合率过高或者施放法术消耗了生命</span>，凯尔希要求博士什么都不要问并抽取博士的血液，装进腰间的仪器转换成淡青色的成品，输送进阿米娅的脖颈，阿米娅立刻苏醒过来。<s class="just-kidding-text" title="只为博君一笑，不必照单全收XD">原来我就是源石病解药啊</s></li>
<li>大部分的泰拉人光是吸入源石粉末，被源石划伤，甚至频繁接触源石制品就会得矿石病。而博士多次亲自上战场<del>且生吃大量源石</del>依然还活的好好的。</li>
<li><s class="just-kidding-text" title="只为博君一笑，不必照单全收XD">曾在一次外勤任务中在叙拉古一拳打趴五个黑帮分子，又一句话震趴下另外十个。</s><span title="你知道的太多了" class="heimu">其实是THRM-EX干的</span></li>
<li>似乎会随身携带几件备用的兜帽。</li>
<li><a href="/%E6%9A%B4%E8%A1%8C" title="暴行">暴行</a>的武器是由博士为她亲手绘制的武器设计图。</li>
<li>虽然石棺不能根除衰老，但是博士依然能借助石棺极大的延长自己的寿命，并且在千百年以后身体“尚无大碍”。</li></ul>
<div class="mw-heading mw-heading3"><h3 id="真实身份"><span id=".E7.9C.9F.E5.AE.9E.E8.BA.AB.E4.BB.BD"></span>真实身份</h3></div>
<p>凯尔希曾在怒号光明M8-8剧情中提到过“石棺”可以治愈博士的病痛，也只能治愈博士的病痛；“也许这台机器只能治疗你的同族”，还提到“石棺”的作用也许是逼迫其中的患者向自己最古老的一面转化。
</p><p>在故事集《如我所见》的“我与最后的赌注”部分中，当博士询问普瑞赛斯是谁时，PRTS曾向博士提供过一张博士和普瑞赛斯的合影，并且照片的标题是“PRTS首次功能测验”。已知PRTS是罗德岛的原生系统，而罗德岛陆舰是雷姆必拓协助发掘出的疑似旧时代遗物，因此PRTS首次功能测验时就已经在罗德岛上的博士与普瑞赛斯可能同为“旧时代”的人，除非罗德岛在被巴别塔成员取得并改造前从未启动过。
</p><p>SideStory「孤星」剧情中，博士被前文明的保存者特雷弗·弗里斯顿称为同族，似乎证实了博士的真实身份确实是旧时代的人类。根据SideStory「孤星」剧情，远古人类疑似于一万三千年前因为某些原因进入休眠仓，作为源石计划产物的源石影响了提卡兹与其后从塔卫二来到泰拉的动物使他们成为了现在的“亚人”，但旧时代人类目前为止只有博士和普瑞赛斯醒来。
</p><p>SideStory「巴别塔」中，博士是源石计划的参与者之一，团队内称呼“预言家”，而源石计划的目的是使源石彻底同化泰拉大陆，让生命与文明都以源石内化宇宙信息的形式存在。本来沉睡在罗德岛号中。在萨卡兹内战期间，凯尔希把博士唤醒，借助博士的智慧对抗特雷西斯，但最终导致特蕾西娅遇刺身亡。而特蕾西娅在弥留之际也清除了博士的所有记忆，让博士得以作为“这片大地”的人生存下去。
</p>
<div class="mw-heading mw-heading3"><h3 id="形象来源"><span id=".E5.BD.A2.E8.B1.A1.E6.9D.A5.E6.BA.90"></span>形象来源</h3></div>
<p>早在2016年左右，手机游戏《<a href="/%E5%B0%91%E5%A5%B3%E5%89%8D%E7%BA%BF" title="少女前线">少女前线</a>》圈内流出了一张游戏中主要人物AR小队成员的印象图，其中对于指挥官的人物形象设定，和现在的博士的形象非常相似，考虑到W曾经是《少女前线》的废稿，当年的这个指挥官形象也可能是被淘汰的废稿之一。<s class="just-kidding-text" title="只为博君一笑，不必照单全收XD">然后亲爹海猫不忍舍弃自己的儿子女儿们就全都接来了罗德岛。</s>
</p>

<div class="mw-heading mw-heading3"><h3 id="理智"><span id=".E7.90.86.E6.99.BA"></span>理智</h3></div>
<p>一般手游中的<a href="/%E7%96%B2%E5%8A%B3%E5%80%BC" title="疲劳值">体力</a>在<a href="/%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F" title="明日方舟">明日方舟</a>中被称为理智，推图及刷图还有加速无人机充电都需要花费理智。由于后期地图需要大量理智，玩家常常会遇到原本攒满的理智被快速花光的窘境。这种情况常常被玩家们调侃为“失去理智”。
</p><p>理智可以自然恢复，也可以手动恢复，每六分钟自然恢复一点理智，当理智达到上限时停止恢复。玩家也可以使用应急理智顶液、应急理智合剂（均含有芥末）或源石<span title="你知道的太多了" class="heimu">以及小饼干、蛋黄味巧克力和<a href="/%E8%82%A5%E5%AE%85%E5%BF%AB%E4%B9%90o" title="肥宅快乐o">肥宅快乐套餐</a></span><sup id="cite_ref-:1_14-1" class="reference"><a href="#cite_note-:1-14"><span class="cite-bracket">&#91;</span>14<span class="cite-bracket">&#93;</span></a></sup>等道具手动恢复理智。
在揭幕者们（2024「感谢庆典」）版本前，一颗源石可以恢复当前等级对应的最大理智数量。自该版本起，1至纯源石兑换的理智从当前理智上限等量理智修改为固定的135理智。
</p><p>应急理智顶液可以通过活动签到等途径获得，应急理智合剂可以通过月卡每日补给获得。但每瓶顶液和合剂都有有效期，有效期过后就不能使用，且通过该方式回复理智最大不超过999。
</p><p>玩家可以通过升级的方式增加理智上限。
</p><p>后期理智自然恢复速度远跟不上消耗速度，于是<ruby><rb data-id="template-ruby">用<span class="template-ruby-hidden">（</span></rb><rt style="font-size:0.75em">吃</rt><span class="template-ruby-hidden">）</span></ruby>源石恢复理智成为了每位刀客塔的日常。<s class="just-kidding-text" title="只为博君一笑，不必照单全收XD">这和吃<a href="/%E8%8A%99%E8%93%89(%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F)" title="芙蓉(明日方舟)">芙蓉</a>的健康餐比起来真是太简单了。</s>
</p>

<div class="mw-heading mw-heading3"><h3 id="手撕"><span id=".E6.89.8B.E6.92.95"></span>手撕</h3></div>
<p>因为在非特定关卡，少量敌方单位到达终点后依然可以通关，此时这些敌方单位就只能是博士消灭的。而由于立绘中博士并未持有任何武器，故诞生了博士手撕敌方单位的梗。<s class="just-kidding-text" title="只为博君一笑，不必照单全收XD">也有可能是被博士吃掉了</s>
</p><p>集成战略二期“傀影与猩红孤钻”的收藏品“无度”的效果是战场上每一个敌方单位进入保护点后对全场造成3000点真实伤害，此伤害可被“文明的存续”拐。故又诞生了“博士吃坏了肚子”“博士打嗝/放屁”的梗。<span title="你知道的太多了" class="heimu">博士3000真伤的屁</span>
</p>
<div class="mw-heading mw-heading3"><h3 id="动画"><span id=".E5.8A.A8.E7.94.BB"></span>动画</h3></div>
<p>2021年10月24日，《明日方舟》宣布动画化，公布的先导PV中的博士声音引发了广大网友的热烈讨论。由于博士声音偏中性，很难将其归为单纯的男性或女性，因此也引发了部分网友对动画人设的不满。此外，根据<a href="/Yostar_Pictures" title="Yostar Pictures">Yostar Pictures</a>官方放出的动画设定图，博士的身高为165cm，与游戏略有出入。
</p><p>同时，博士在动画中也拥有了属于自己的面孔<span title="你知道的太多了" class="heimu">甚至OP影像中的兜帽都透明了</span>。博士白发灰瞳的清秀脸庞也使一些刀客塔们极为兴奋。
</p><p>由于动画的博士头部被绘制得很长，故有时会调侃博士是《POP子与PIPI美的日常》中的<a href="/PIPI%E7%BE%8E" title="PIPI美">PIPI美</a>。恰好第一话播出后的第二天《POP子与PIPI美的日常》第二季第5话的PIPI美声优也是<a href="/%E7%94%B2%E6%96%90%E7%94%B0%E5%B9%B8" title="甲斐田幸">甲斐田幸</a>。<span title="你知道的太多了" class="heimu"><a target="_blank" rel="nofollow noreferrer noopener" class="external text" href="https://weibo.com/1800333020/MbVAdt7PY">官方画师甚至也玩了这个梗</a></span>
</p>
